apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: roboshop
  labels: 
    project: roboshop
    tier: frontend
  annotations: 
    kubernetes.io/change-cause: "moving to 1.29.7"  
spec:
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.7
        