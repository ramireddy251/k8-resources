apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-046c756737eecb309
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-pvc
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: roboshop
  labels: 
    project: roboshop
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx
      volumeMounts:
      - name: html-data
        mountPath: /usr/share/nginx/html
      nodeSelector:
        topology.kubernetes.io/zone: us-east-1d    
      volumes:
      - name: html-data
        persistentVolumeClaim:
          claimName: ebs-static