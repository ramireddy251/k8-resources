apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: roboshop
  labels: 
    project: roboshop
    tier: frontend
    component: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: app1
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: app1
    spec:
      containers:
      - name: app1
        image: 966392474288.dkr.ecr.us-east-1.amazonaws.com/app-1:latest
---

apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: roboshop
spec:
  type: ClusterIP
  selector: 
    project: roboshop
    tier: frontend
    component: app1
  ports:
  - protocol: TCP
    port: 80 # service port
    targetPort: 80  # container port